version: 2

sources:
  - name: raw
    description: >
      Tables populated outside dbt, by the ingestion pipeline
      (adzuna.py -> transform.py -> load.py). dbt reads from these but
      never writes to them.
    schema: main
    tables:
      - name: jobs
        description: >
          One row per unique job posting, accumulated daily from the Adzuna
          API and deduplicated by id. This is the boundary where data
          quality was already validated (schema pinning, non-fatal handling
          of missing company names) — models downstream can trust it.
        columns:
          - name: id
            description: Adzuna's unique job posting identifier.
            tests:
              - unique
              - not_null
          - name: title
            tests:
              - not_null